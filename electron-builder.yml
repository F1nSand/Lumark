appId: com.lumark.app
productName: Lumark
directories:
  buildResources: build
  output: release
files:
  - main.js
  - preload.js
  - index.html
  - build/**/*
  - src/**/*
  - package.json
  - '!node_modules/**/*'
  - '!**/*.map'
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  artifactName: Lumark-${version}-${arch}.exe
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lumark
  artifactName: Lumark-Setup-${version}.exe
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
